<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | zcyisiee</title>
    <style>
      /* ============================================
         Sveltia CMS Custom Split Layout
         左侧: 元数据字段 (标题/日期/分类/标签/描述)
         右侧: 正文 Markdown 编辑器
         ============================================ */

      /* 目标容器: .content.svelte-1vy4qxn 包含所有 section.field */
      .split-editor-layout {
        display: grid !important;
        grid-template-columns: 300px 1fr !important;
        gap: 20px !important;
        align-items: start !important;
        padding: 16px !important;
        height: calc(100vh - 120px) !important;
        overflow: hidden !important;
      }

      /* 左侧元数据列容器 */
      .split-editor-layout .metadata-column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        max-height: 100%;
        padding-right: 8px;
      }

      /* 左侧字段样式 - 紧凑 */
      .split-editor-layout .metadata-column > section.field {
        background: var(--sui-primary-background-color, #fff);
        border: 1px solid var(--sui-secondary-border-color, #e5e7eb);
        border-radius: 8px;
        padding: 12px 16px;
        margin: 0 !important;
      }

      /* 字段标题更紧凑 */
      .split-editor-layout .metadata-column > section.field > header {
        margin-bottom: 8px;
      }

      .split-editor-layout .metadata-column > section.field > header h4 {
        font-size: 0.85rem !important;
        font-weight: 600 !important;
        color: var(--sui-secondary-foreground-color, #6b7280);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      /* 右侧正文编辑器列 */
      .split-editor-layout .body-column {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .split-editor-layout .body-column > section.field {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--sui-primary-background-color, #fff);
        border: 1px solid var(--sui-secondary-border-color, #e5e7eb);
        border-radius: 8px;
        overflow: hidden;
      }

      /* 正文编辑器内部填满 */
      .split-editor-layout .body-column > section.field > .field-wrapper {
        flex: 1 !important;
        min-height: 0 !important;
        height: 100% !important;
        overflow: hidden !important;
      }

      /* 编辑器容器 - 支持 Lexical 和 CodeMirror */
      .split-editor-layout .body-column .wrapper.svelte-duifo7,
      .split-editor-layout .body-column .sui.text-editor,
      .split-editor-layout .body-column .wrapper.svelte-1p01mhr {
        flex: 1 !important;
        display: flex !important;
        flex-direction: column !important;
        min-height: 0 !important;
        overflow: hidden !important;
      }

      /* Lexical 编辑器滚动 */
      .split-editor-layout .body-column .lexical-root {
        flex: 1 !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        min-height: 0 !important;
        max-height: calc(100vh - 280px) !important;
        padding: 16px !important;
      }

      /* CodeMirror 编辑器 (备用) */
      .split-editor-layout .body-column .cm-editor {
        flex: 1 !important;
        min-height: 0 !important;
        height: 100% !important;
      }

      .split-editor-layout .body-column .cm-scroller {
        overflow: auto !important;
      }

      /* 隐藏正文字段的标题栏（可选，节省空间） */
      .split-editor-layout .body-column > section.field > header {
        padding: 8px 16px;
        border-bottom: 1px solid var(--sui-secondary-border-color, #e5e7eb);
      }

      /* 响应式: 小屏幕恢复单列 */
      @media (max-width: 900px) {
        .split-editor-layout {
          grid-template-columns: 1fr !important;
          height: auto !important;
          overflow: visible !important;
        }

        .split-editor-layout .metadata-column,
        .split-editor-layout .body-column {
          max-height: none;
        }

        .split-editor-layout .body-column .cm-editor {
          height: 60vh !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <script>
      /**
       * Sveltia CMS Customization Script
       * 1. Layout: 左侧元数据 + 右侧正文编辑器
       * 2. Integration: PicGo Auto-Upload on Paste
       */

      (function () {
        // --- Configuration ---
        const PICGO_API = "http://127.0.0.1:36677/upload";

        // --- Layout Customization ---
        let isApplyingLayout = false; // 防止递归

        function applyCustomLayout() {
          // 防止递归调用
          if (isApplyingLayout) return;

          // 查找正文字段 (data-key-path="body")
          const bodyField = document.querySelector(
            'section.field[data-key-path="body"]',
          );
          if (!bodyField) return false;

          // 获取父容器 - 必须是原始的 .content 容器，不能是我们创建的列
          const container = bodyField.parentElement;
          if (!container) return false;

          // 如果父容器已经是我们的列容器，说明布局已应用
          if (
            container.classList.contains("body-column") ||
            container.classList.contains("metadata-column") ||
            container.classList.contains("split-editor-layout")
          ) {
            return false;
          }

          // 确保是正确的容器 (包含 .content 类)
          if (!container.classList.contains("content")) return false;

          isApplyingLayout = true;

          try {
            // 获取所有直接子字段
            const allFields = Array.from(
              container.querySelectorAll(":scope > section.field[data-key-path]"),
            );
            if (allFields.length === 0) {
              isApplyingLayout = false;
              return false;
            }

            // 创建左侧元数据列
            const metadataColumn = document.createElement("div");
            metadataColumn.className = "metadata-column";

            // 创建右侧正文列
            const bodyColumn = document.createElement("div");
            bodyColumn.className = "body-column";

            // 分类字段到对应列
            allFields.forEach((field) => {
              const keyPath = field.getAttribute("data-key-path");
              if (keyPath === "body") {
                bodyColumn.appendChild(field);
              } else {
                metadataColumn.appendChild(field);
              }
            });

            // 添加新结构（不使用 innerHTML = "" 避免触发额外的 mutation）
            container.appendChild(metadataColumn);
            container.appendChild(bodyColumn);

            // 应用布局 class
            container.classList.add("split-editor-layout");

            console.log("Sveltia CMS: Split editor layout applied.");
            return true;
          } finally {
            isApplyingLayout = false;
          }
        }

        // Observer to apply layout when DOM changes
        let layoutApplied = false;
        let pendingTimeout = null;

        const observer = new MutationObserver((mutations) => {
          // 如果正在应用布局，忽略
          if (isApplyingLayout) return;

          // 检查是否存在未处理的正文字段
          const bodyField = document.querySelector(
            'section.field[data-key-path="body"]',
          );

          if (bodyField && !layoutApplied) {
            const container = bodyField.parentElement;
            // 检查是否是原始容器（未被处理过）
            if (
              container &&
              container.classList.contains("content") &&
              !container.classList.contains("split-editor-layout")
            ) {
              // 防抖：取消之前的定时器
              if (pendingTimeout) {
                clearTimeout(pendingTimeout);
              }
              // 延迟执行确保 DOM 完全加载
              pendingTimeout = setTimeout(() => {
                if (applyCustomLayout()) {
                  layoutApplied = true;
                }
                pendingTimeout = null;
              }, 150);
            }
          }

          // 页面导航时重置标志
          if (!bodyField) {
            layoutApplied = false;
            if (pendingTimeout) {
              clearTimeout(pendingTimeout);
              pendingTimeout = null;
            }
          }
        });

        // Start observing
        observer.observe(document.body, { childList: true, subtree: true });

        // --- PicGo Integration ---
        async function uploadToPicGo(file) {
          const formData = new FormData();
          formData.append("list", file);

          try {
            const response = await fetch(PICGO_API, {
              method: "POST",
              body: formData,
            });

            if (!response.ok) {
              throw new Error(
                `PicGo Server Error: ${response.status} ${response.statusText}`,
              );
            }

            const text = await response.text();
            console.log("PicGo Raw Response:", text);

            let data;
            try {
              data = JSON.parse(text);
            } catch (e) {
              throw new Error(
                `Invalid JSON response: ${text.substring(0, 50)}...`,
              );
            }

            if (data.success && data.result && data.result.length > 0) {
              return data.result[0];
            } else if (
              data.result &&
              Array.isArray(data.result) &&
              data.result.length > 0
            ) {
              return data.result[0];
            } else {
              console.error("PicGo Unexpected Data:", data);
              const msg = data.message || JSON.stringify(data);
              throw new Error(`PicGo Error: ${msg}`);
            }
          } catch (error) {
            console.error("PicGo Upload Failed:", error);
            alert(
              `PicGo Upload Failed: ${error.message}\n\nNote: If you are on HTTPS, your browser might block requests to local PicGo (HTTP). Please allow mixed content or run CMS locally.`,
            );
            return null;
          }
        }

        function insertText(text) {
          const activeEl = document.activeElement;
          if (!activeEl) return;

          if (activeEl.tagName === "TEXTAREA" || activeEl.tagName === "INPUT") {
            const start = activeEl.selectionStart;
            const end = activeEl.selectionEnd;
            const val = activeEl.value;
            activeEl.value = val.slice(0, start) + text + val.slice(end);
            activeEl.selectionStart = activeEl.selectionEnd =
              start + text.length;
            activeEl.dispatchEvent(new Event("input", { bubbles: true }));
          } else if (activeEl.isContentEditable) {
            document.execCommand("insertText", false, text);
          }
        }

        document.addEventListener(
          "paste",
          async (e) => {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;

            let imageFile = null;
            for (let i = 0; i < items.length; i++) {
              if (items[i].type.indexOf("image") !== -1) {
                imageFile = items[i].getAsFile();
                break;
              }
            }

            if (imageFile) {
              const activeElement = document.activeElement;
              const isEditor =
                activeElement &&
                (activeElement.tagName === "TEXTAREA" ||
                  activeElement.contentEditable === "true" ||
                  activeElement.closest(".cm-editor"));

              if (isEditor) {
                e.preventDefault();

                const placeholder = `![Uploading ${imageFile.name}...]`;
                insertText(placeholder);

                const result = await uploadToPicGo(imageFile);

                if (result) {
                  if (activeElement.tagName === "TEXTAREA") {
                    activeElement.value = activeElement.value.replace(
                      placeholder,
                      `![](${result})`,
                    );
                    activeElement.dispatchEvent(
                      new Event("input", { bubbles: true }),
                    );
                  } else {
                    insertText(`\n![](${result})`);
                  }
                } else {
                  insertText(`\n<!-- Upload Failed -->`);
                }
              }
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
